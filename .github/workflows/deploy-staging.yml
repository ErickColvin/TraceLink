name: Deploy staging

on:
  workflow_run:
    workflows: [CI]
    branches: [main]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: read
  deployments: write

concurrency:
  group: deploy-staging
  cancel-in-progress: false

# A job-level `if` only sees organization and repository variables: environment
# variables are published to the runner after the job starts. STAGING_API_BASE_URL,
# STAGING_WEB_URL and STAGING_API_URL must therefore be REPOSITORY variables, or
# these gates never open. While they are unset the jobs skip instead of failing,
# so staging can be provisioned before its public URLs exist.
#
# STAGING_RENDER_ENABLED (repository variable, 'true') switches the API path to
# Neon + Render: versioned migrations run first, then Render deploys exactly the
# commit that passed CI. Render auto-deploy must stay Off. While the variable is
# unset both jobs skip and Pages/smoke behave as before.
jobs:
  migrate:
    name: Staging migrations (Neon)
    if: >-
      (github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success')
      && vars.STAGING_RENDER_ENABLED == 'true'
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Apply versioned migrations
        run: pnpm db:migrate
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

  api:
    name: Render API staging
    needs: migrate
    environment: staging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      RELEASE_COMMIT: ${{ github.event.workflow_run.head_sha || github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.RELEASE_COMMIT }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Deploy the CI-verified commit
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          curl --fail --silent --show-error --output /dev/null \
            -X POST "${RENDER_DEPLOY_HOOK_URL}&ref=${RELEASE_COMMIT}"
      - name: Wait until the API serves that commit
        run: node tools/wait-for-release.mjs
        env:
          RELEASE_API_URL: ${{ vars.STAGING_API_URL }}

  web:
    name: Cloudflare Pages staging
    needs: [migrate, api]
    if: >-
      !cancelled()
      && ((needs.migrate.result == 'success' && needs.api.result == 'success')
      || (needs.migrate.result == 'skipped' && needs.api.result == 'skipped'))
      && (github.event_name == 'workflow_dispatch'
      || github.event.workflow_run.conclusion == 'success')
      && vars.STAGING_API_BASE_URL != ''
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Build shared contracts
        run: pnpm --filter @tracelink/contracts build
      - name: Build HTTP frontend
        run: pnpm --filter @tracelink/web build
        env:
          VITE_DATA_MODE: http
          VITE_API_BASE_URL: ${{ vars.STAGING_API_BASE_URL }}
      - name: Verify Pages preview target
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          PAGES_PROJECT: ${{ vars.CLOUDFLARE_PAGES_PROJECT }}
        run: |
          node --input-type=module <<'NODE'
          const { CLOUDFLARE_ACCOUNT_ID: account, CLOUDFLARE_API_TOKEN: token, PAGES_PROJECT: project } = process.env;
          const response = await fetch(`https://api.cloudflare.com/client/v4/accounts/${encodeURIComponent(account)}/pages/projects/${encodeURIComponent(project)}`, { headers: { Authorization: `Bearer ${token}` } });
          const payload = await response.json();
          if (!response.ok || !payload.success) throw new Error(`Cannot verify Pages preview target (HTTP ${response.status}).`);
          const productionBranch = payload.result?.production_branch;
          if (!productionBranch || productionBranch === 'staging') throw new Error('Refusing staging deploy: production branch is staging or unknown.');
          console.log('Verified: staging is a preview branch, not production.');
          NODE
      - name: Deploy Pages preview
        uses: cloudflare/wrangler-action@v4
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          packageManager: pnpm
          # Install/run Wrangler inside the web package, not the workspace root.
          workingDirectory: apps/web
          command: pages deploy dist --project-name=${{ vars.CLOUDFLARE_PAGES_PROJECT }} --branch=staging
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}

  smoke:
    name: Staging smoke
    needs: web
    if: vars.STAGING_WEB_URL != '' && vars.STAGING_API_URL != ''
    environment: staging
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          persist-credentials: false
      - run: node tools/smoke-deployment.mjs
        env:
          SMOKE_WEB_URL: ${{ vars.STAGING_WEB_URL }}
          SMOKE_API_URL: ${{ vars.STAGING_API_URL }}
